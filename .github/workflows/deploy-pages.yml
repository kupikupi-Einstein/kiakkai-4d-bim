# Deploy the static 4D BIM web app to GitHub Pages on every push to main
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the app and sample schedule are valid
        run: |
          test -f index.html
          python3 -c "import json; json.load(open('sample/schedule_R2.json')); json.load(open('manifest.webmanifest'))"
      - name: Prepare site folder (app files only – no tools, no source docs)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons sample .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
